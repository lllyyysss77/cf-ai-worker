# Cf Ai Worker Workflow Model Config Refresh

## Action

Follow the model-config-refresh workflow:
1. Update model configuration in src/config/models.ts
2. Add or update plan and design docs in docs/superpowers/plans/ and docs/superpowers/specs/
3. Update README.md with usage or mapping instructions
4. Update or add tests in tests/model-config.test.mjs and tests/model-routing.test.mjs

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/config/models.ts, docs/superpowers/plans/*.md, docs/superpowers/specs/*.md

